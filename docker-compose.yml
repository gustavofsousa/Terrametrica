services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: terrametrica
      POSTGRES_PASSWORD: terrametrica
      POSTGRES_DB: terrametrica
    ports:
      - "5433:5432"
    volumes:
      - terrametrica-db-data:/var/lib/postgresql/data

volumes:
  terrametrica-db-data:
